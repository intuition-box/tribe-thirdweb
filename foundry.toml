[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
  "@thirdweb-dev/=node_modules/@thirdweb-dev/",
  "@openzeppelin/=lib/openzeppelin-contracts/"
]

optimizer = true
optimizer_runs = 50
via_ir = true

# Solidity version
solc_version = "0.8.24"

# Use this profile when deployment hits "max code size exceeded" (smallest bytecode).
# optimizer_runs = 1 minimizes deployed bytecode size to stay under EIP-170 limit (24576 bytes).
[profile.deploy]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
  "@thirdweb-dev/=node_modules/@thirdweb-dev/",
  "@openzeppelin/=lib/openzeppelin-contracts/"
]
optimizer = true
optimizer_runs = 1
via_ir = true
solc_version = "0.8.24"

# Production profile with higher optimizer runs for better gas efficiency (use after deploy succeeds)
[profile.production]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
  "@thirdweb-dev/=node_modules/@thirdweb-dev/",
  "@openzeppelin/=lib/openzeppelin-contracts/"
]
optimizer = true
optimizer_runs = 1000
via_ir = true
solc_version = "0.8.24"

# See more config options https://github.com/foundry-rs/foundry/tree/master/config