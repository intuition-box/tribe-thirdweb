[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
  "@thirdweb-dev/=node_modules/@thirdweb-dev/",
  "@openzeppelin/=lib/openzeppelin-contracts/"
]

# Optimizer settings for deployment
optimizer = true
optimizer_runs = 200  # Lower runs = smaller bytecode size (prioritize size over gas efficiency)
# Higher runs (e.g., 1000-10000) = better gas efficiency but larger bytecode
# For production, consider 1000-5000 runs for better gas efficiency

# Enable via-IR to help with stack too deep errors and better optimization
via_ir = true

# Solidity version
solc_version = "0.8.24"

# Production profile with higher optimizer runs for better gas efficiency
[profile.production]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
  "@thirdweb-dev/=node_modules/@thirdweb-dev/",
  "@openzeppelin/=lib/openzeppelin-contracts/"
]
optimizer = true
optimizer_runs = 1000  # Higher runs for better gas efficiency in production
via_ir = true
solc_version = "0.8.24"

# See more config options https://github.com/foundry-rs/foundry/tree/master/config